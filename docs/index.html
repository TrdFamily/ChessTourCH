<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243b53"><title>ChessTour CH</title>
<style>body{font:16px system-ui;background:#f5f7fa;color:#243b53;margin:0}header{background:#243b53;color:white;padding:14px 12px 10px}header h1{font-size:19px;line-height:1.3;margin:0}main{max-width:960px;margin:auto;padding:8px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}button,select,input{font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:white}.calendar{width:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-width:0;overflow:hidden;background:white;min-height:115px;border-radius:8px;padding:5px;font-size:12px}.day b{display:block}.event{display:block;max-width:100%;overflow:hidden;background:#dbeafe;border-radius:5px;padding:4px;margin:3px 0;overflow-wrap:anywhere;font-size:11px;line-height:1.3}.card{overflow-wrap:anywhere;background:white;border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001}.muted{color:#64748b}a{color:#1457a5}.hidden{display:none}@media(max-width:600px){main{padding:10px}.controls{gap:6px}.controls button,.controls select{font-size:14px;padding:7px}.calendar{gap:3px}.day{min-height:115px;font-size:11px;padding:3px}.day .event{font-size:10px;white-space:normal;line-height:1.25;max-height:none;overflow-wrap:anywhere}.day .event{background:#dbeafe}.card{padding:12px}}.day.has-events{cursor:pointer;outline:1px solid #b3d0ef}.day:focus{outline:2px solid #1457a5}.event-card{cursor:pointer}.event[role=button]{cursor:pointer}.event strong{font-size:inherit}#selected-day{margin-top:14px}#selected-day:empty{display:none} .category-tabs{display:flex;gap:3px;background:#e6edf5;padding:3px;border-radius:10px}.category-tabs button{border:0;background:transparent;padding:7px 11px;font-size:14px}.category-tabs button.active{background:#243b53;color:white;font-weight:700}#status{font-size:12px;margin:3px 0 5px}@media(max-width:600px){header{padding:8px 10px}main{padding:7px}.controls{margin:5px 0;gap:5px}.controls button,.controls select{padding:6px;font-size:13px}.category-tabs{width:100%;justify-content:space-between}.category-tabs button{flex:1;font-size:14px}}  .category-tabs{display:flex;gap:3px;background:#e6edf5;padding:3px;border-radius:10px}.category-tabs button{border:0;background:transparent;padding:7px 11px;font-size:14px}.category-tabs button.active{background:#243b53;color:white;font-weight:700}#status{font-size:12px;margin:3px 0 5px}@media(max-width:600px){header{padding:8px 10px}main{padding:7px}.controls{margin:5px 0;gap:5px}.controls button,.controls select{padding:6px;font-size:13px}.category-tabs{width:100%;justify-content:space-between}.category-tabs button{flex:1;font-size:14px}}  .event.event-adult{background:#dbeafe;color:#164a85}.event.event-junior{background:#dcfce7;color:#166534}.category-tabs button[data-category='Adultes'].active{background:#2563eb;color:white}.category-tabs button[data-category='Junior'].active{background:#15803d;color:white}.day{min-height:78px}@media(max-width:600px){.day{min-height:70px}.day .event{font-size:10px;padding:4px 2px;line-height:1.2}} </style></head><body>
<header><h1>♟ ChessTour CH</h1></header>
<main><p id="status" class="muted">Chargement…</p>
<div class="controls"><button id="prev">◀</button><strong id="month"></strong><button id="next">▶</button><button id="today">Ce mois</button><select id="view"><option value="calendar">Calendrier</option><option value="list">Liste</option></select><div class="category-tabs" role="group" aria-label="Catégorie des tournois"><button type="button" data-category="all" class="active" aria-pressed="true">Tous</button><button type="button" data-category="Adultes" aria-pressed="false">Adultes</button><button type="button" data-category="Junior" aria-pressed="false">Jeunes</button></div></div>
<div id="calendar"></div><div id="selected-day" aria-live="polite"></div><div id="list"></div></main>
<script>
const today=new Date(),state={month:new Date(today.getFullYear(),today.getMonth(),1),events:[],view:'calendar',category:'all'};
const $=id=>document.getElementById(id), fmt=d=>new Intl.DateTimeFormat('fr-CH',{month:'long',year:'numeric'}).format(d);
function date(s){return new Date(s+'T12:00:00')}
function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function locationOf(e){return (e.city||e.title.split(':')[0]||'Lieu à confirmer').trim()}function timeOf(e){return e.time||'Horaire à confirmer'}function priceOf(e){const p=e.category==='Junior'?e.juniorPrice:e.adultPrice;return p==null?'Prix à confirmer':(typeof p==='number'?'CHF '+p:String(p))}function deadlineOf(e){if(!e.registrationDeadline)return 'Date limite non communiquée';const d=date(e.registrationDeadline);return d.toLocaleDateString('fr-CH')+(e.registrationDeadlineTime?' à '+e.registrationDeadlineTime:'')}function chessmatesDeepLink(e){
  const base=e.firstSourceUrl||e.discoveryUrl||e.source||'';
  if(!/^https:\/\/chessmates\.live\//i.test(base))return base;
  // Text fragments scroll to the tournament name when it appears on the page.
  // Avoid passing an existing hash or query through to the fragment.
  const label=(e.title||'').trim();
  return base.split('#')[0]+(label?'#:~:text='+encodeURIComponent(label):'');
}
function verificationOf(e){return e.verificationStatus==='double_checked'?'Double vérification effectuée':e.verificationStatus==='conflict'?'Sources contradictoires — vérification nécessaire':'Double vérification non effectuée';}
function detail(e){return '<article class="card"><h2>'+safe(e.title)+'</h2><p>📍 '+safe(e.venue||locationOf(e))+'</p><p>📅 '+date(e.date).toLocaleDateString('fr-CH')+'</p><p>🕒 '+safe(timeOf(e))+'</p><p>💰 '+safe(priceOf(e))+'</p>'+(e.address?'<p>Adresse : '+safe(e.address)+'</p>':e.addressProvisional?'<p>Adresse trouvée (à vérifier) : '+safe(e.addressProvisional)+'</p>':'<p>Adresse exacte : à confirmer</p>')+'<p>Catégorie : '+safe(e.category)+'</p>'+'<p><strong>Vérification : '+safe(verificationOf(e))+'</strong></p>'+(e.eligibility?'<p>Conditions : '+safe(e.eligibility)+'</p>':'')+'<p>⏳ Date limite d’inscription : '+safe(deadlineOf(e))+'</p>'+(e.registrationDeadlineNote?'<p class="muted">'+safe(e.registrationDeadlineNote)+'</p>':'')+(e.url&&/^https?:\/\//i.test(e.url)?'<p><a target="_blank" rel="noopener" href="'+safe(e.url)+'">Annonce officielle du tournoi</a></p>':'<p class="muted">Annonce officielle de cette édition non encore identifiée.</p>')+(e.organizerUrl?'<p><a target="_blank" rel="noopener" href="'+safe(e.organizerUrl)+'">Site du club / organisateur (pas l’annonce de cette édition)</a></p>':'')+(e.firstSourceUrl&&/^https?:\/\//i.test(e.firstSourceUrl)?'<p><a target="_blank" rel="noopener" href="'+safe(chessmatesDeepLink(e))+'">Première source trouvée ('+(e.firstSourceType==='organizer'?'organisateur':'source de découverte')+')</a><br><small class="muted">'+safe(e.sourceLocation||'Emplacement exact non repéré')+'</small></p>':'')+(e.addressSource&&/^https?:\/\//i.test(e.addressSource)?'<p><a target="_blank" rel="noopener" href="'+safe(e.addressSource)+'">Source de l’adresse</a> · '+safe(e.addressSourceLocation||'Emplacement non repéré')+'</p>':'')+(e.addressEvidence?'<p class="muted"><small>Extrait : '+safe(e.addressEvidence)+'</small></p>':'')+(e.registrationUrl&&e.registrationUrl!==e.url?'<p><a target="_blank" rel="noopener" href="'+safe(e.registrationUrl)+'">'+(e.registrationUrl.startsWith('mailto:')?'Inscription par e-mail':'Formulaire / lien d’inscription')+'</a></p>':'')+(e.address?'<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.address+', Suisse')+'">Voir l’adresse sur Google Maps'+(e.addressVerified?'':' (emplacement à confirmer)')+'</a></p>':'<p class="muted">Itinéraire indisponible : adresse non renseignée.</p>')+'</article>'}function showDetail(e){$('calendar').className='hidden';$('list').className='hidden';$('selected-day').innerHTML='<button id="back-calendar" type="button">← Retour au calendrier</button>'+detail(e);$('back-calendar').onclick=()=>render();window.scrollTo(0,0)}function card(e){return '<article class="card event-card" role="button" tabindex="0" data-event="'+safe(e.id)+'"><strong>'+safe(locationOf(e))+'</strong><p>'+date(e.date).toLocaleDateString('fr-CH')+' · '+safe(timeOf(e))+'</p><p>'+safe(priceOf(e))+'</p><small>Voir les détails →</small></article>'}
function filtered(){return state.events.filter(e=>state.category==='all'||e.category===state.category)}
function render(){const m=state.month;$('selected-day').innerHTML='';$('month').textContent=fmt(m);$('calendar').className=state.view==='calendar'?'':'hidden';$('list').className=state.view==='list'?'':'hidden';const events=filtered();$('list').innerHTML=events.length?events.map(card).join(''):'<p>Aucun tournoi disponible pour ce filtre.</p>';let html='<div class="calendar">';for(const n of ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'])html+='<div class="muted">'+n+'</div>';const offset=(m.getDay()+6)%7;for(let i=0;i<offset;i++)html+='<div></div>';const count=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();for(let day=1;day<=count;day++){const key=m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');const matches=events.filter(e=>e.date<=key&&(e.endDate||e.date)>=key);html+='<div class="day'+(matches.length?' has-events':'')+'"'+(matches.length?' tabindex="0" role="button" data-day="'+key+'" aria-label="'+day+' : '+matches.length+' tournoi(s)"':'')+'><b>'+day+'</b>'+matches.map(e=>'<div class="event '+(e.category==='Junior'?'event-junior':'event-adult')+'" data-event="'+safe(e.id)+'" role="button" tabindex="0" title="'+safe(e.title)+'"><strong>'+safe(locationOf(e))+'</strong></div>').join('')+'</div>'}html+='</div>';$('calendar').innerHTML=html;document.querySelectorAll('[data-day]').forEach(el=>{const show=()=>{const key=el.dataset.day;const matches=events.filter(e=>e.date<=key&&(e.endDate||e.date)>=key);$('selected-day').innerHTML='<h3>Tournois du '+date(key).toLocaleDateString('fr-CH')+'</h3>'+matches.map(card).join('');bindEventCards();$('selected-day').scrollIntoView({behavior:'smooth',block:'nearest'})};el.addEventListener('click',ev=>{if(ev.target.closest('[data-event]'))return;show()});el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();show()}})});bindEventCards()}
function bindEventCards(){document.querySelectorAll('[data-event]').forEach(el=>{const show=()=>{const e=state.events.find(item=>item.id===el.dataset.event);if(e)showDetail(e)};el.onclick=show;el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();show()}}})}
// Navigation tactile horizontale dans la vue calendrier uniquement.
let swipeStart=null;
const calendarEl=$('calendar');
calendarEl.addEventListener('touchstart',ev=>{
  if(state.view!=='calendar'||ev.touches.length!==1){swipeStart=null;return}
  const t=ev.touches[0];swipeStart={x:t.clientX,y:t.clientY,time:Date.now()};
},{passive:true});
calendarEl.addEventListener('touchend',ev=>{
  if(!swipeStart||state.view!=='calendar'||ev.changedTouches.length!==1)return;
  const t=ev.changedTouches[0],dx=t.clientX-swipeStart.x,dy=t.clientY-swipeStart.y;
  swipeStart=null;
  if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.4)return;
  state.month=new Date(state.month.getFullYear(),state.month.getMonth()+(dx<0?1:-1),1);
  render();
},{passive:true});
calendarEl.addEventListener('touchcancel',()=>{swipeStart=null},{passive:true});
$('prev').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);render()};$('next').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);render()};$('today').onclick=()=>{state.month=new Date(today.getFullYear(),today.getMonth(),1);render()};$('view').onchange=e=>{state.view=e.target.value;render()};document.querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{state.category=button.dataset.category;document.querySelectorAll('[data-category]').forEach(b=>{const active=b===button;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});render()});
fetch('./tournois.json?time='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{state.events=Array.isArray(data)?data.filter(e=>e.date>=today.toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)):[];$('status').textContent=state.events.length+' tournois répertoriés · '+state.events.filter(e=>e.dataQuality==='official_page').length+' annonces officielles identifiées';render()}).catch(e=>{$('status').textContent='Impossible de charger les données : '+e.message;render()});
</script></body></html>
