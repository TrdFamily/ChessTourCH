<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243b53"><title>ChessTour CH</title>
<style>body{font:16px system-ui;background:#f5f7fa;color:#243b53;margin:0}header{background:#243b53;color:white;padding:14px 12px 10px}header h1{font-size:19px;line-height:1.3;margin:0}main{max-width:960px;margin:auto;padding:8px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}button,select,input{font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:white}.calendar{width:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-width:0;overflow:hidden;background:white;min-height:115px;border-radius:8px;padding:5px;font-size:12px}.day b{display:block}.event{display:block;max-width:100%;overflow:hidden;background:#dbeafe;border-radius:5px;padding:4px;margin:3px 0;overflow-wrap:anywhere;font-size:11px;line-height:1.3}.card{overflow-wrap:anywhere;background:white;border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001}.muted{color:#64748b}a{color:#1457a5}.hidden{display:none}@media(max-width:600px){main{padding:10px}.controls{gap:6px}.controls button,.controls select{font-size:14px;padding:7px}.calendar{gap:3px}.day{min-height:115px;font-size:11px;padding:3px}.day .event{font-size:10px;white-space:normal;line-height:1.25;max-height:none;overflow-wrap:anywhere}.day .event{background:#dbeafe}.card{padding:12px}}.day.has-events{cursor:pointer;outline:1px solid #b3d0ef}.day:focus{outline:2px solid #1457a5}.event-card{cursor:pointer}.event[role=button]{cursor:pointer}.event strong{font-size:inherit}#selected-day{margin-top:14px}#selected-day:empty{display:none} .category-tabs{display:flex;gap:3px;background:#e6edf5;padding:3px;border-radius:10px}.category-tabs button{border:0;background:transparent;padding:7px 11px;font-size:14px}.category-tabs button.active{background:#243b53;color:white;font-weight:700}#status{font-size:12px;margin:3px 0 5px}@media(max-width:600px){header{padding:8px 10px}main{padding:7px}.controls{margin:5px 0;gap:5px}.controls button,.controls select{padding:6px;font-size:13px}.category-tabs{width:100%;justify-content:space-between}.category-tabs button{flex:1;font-size:14px}}  .category-tabs{display:flex;gap:3px;background:#e6edf5;padding:3px;border-radius:10px}.category-tabs button{border:0;background:transparent;padding:7px 11px;font-size:14px}.category-tabs button.active{background:#243b53;color:white;font-weight:700}#status{font-size:12px;margin:3px 0 5px}@media(max-width:600px){header{padding:8px 10px}main{padding:7px}.controls{margin:5px 0;gap:5px}.controls button,.controls select{padding:6px;font-size:13px}.category-tabs{width:100%;justify-content:space-between}.category-tabs button{flex:1;font-size:14px}}  .event.event-adult{background:#dbeafe;color:#164a85}.event.event-junior{background:#dcfce7;color:#166534}.category-tabs button[data-category='Adultes'].active{background:#2563eb;color:white}.category-tabs button[data-category='Junior'].active{background:#15803d;color:white}.day{min-height:78px}@media(max-width:600px){.day{min-height:70px}.day .event{font-size:10px;padding:4px 2px;line-height:1.2}} header{padding:3px 10px!important}header h1{font-size:15px!important;line-height:1.15!important;font-weight:650}main{padding-top:4px!important}.status-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.status-row p{margin:2px 0;line-height:1.15}.status-row button{font-size:11px;padding:3px 7px;white-space:nowrap}.detail-card p{margin:9px 0;line-height:1.45}.detail-card h2{font-size:19px;margin:3px 0 14px}.detail-card .verification{font-size:11px;border-top:1px solid #e2e8f0;padding-top:9px;margin-top:14px}.primary-link{font-weight:650}#refresh-progress{height:4px;background:#dbe5f0;border-radius:5px;overflow:hidden;margin:3px 0 5px}#refresh-fill{height:100%;width:0;background:#2563eb;transition:width .2s ease}#refresh-progress.hidden{display:none}</style></head><body>
<header><h1>♟ ChessTour CH</h1></header>
<main><div class="status-row"><p id="status" class="muted">Chargement…</p><button id="refresh" type="button" aria-label="Actualiser les tournois">↻ Actualiser</button></div><div id="refresh-progress" class="hidden" role="progressbar" aria-label="Chargement des tournois"><div id="refresh-fill"></div></div>
<div class="controls"><button id="prev">◀</button><strong id="month"></strong><button id="next">▶</button><button id="today">Ce mois</button><select id="view"><option value="calendar">Calendrier</option><option value="list">Liste</option></select><div class="category-tabs" role="group" aria-label="Catégorie des tournois"><button type="button" data-category="all" class="active" aria-pressed="true">Tous</button><button type="button" data-category="Adultes" aria-pressed="false">Adultes</button><button type="button" data-category="Junior" aria-pressed="false">Jeunes</button></div></div>
<div id="calendar"></div><div id="selected-day" aria-live="polite"></div><div id="list"></div></main>
<script>
const today=new Date(),state={month:new Date(today.getFullYear(),today.getMonth(),1),events:[],view:'calendar',category:'all'};
const $=id=>document.getElementById(id), fmt=d=>new Intl.DateTimeFormat('fr-CH',{month:'long',year:'numeric'}).format(d);
function date(s){return new Date(s+'T12:00:00')}
function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function locationOf(e){return (e.city||e.title.split(':')[0]||'Lieu à confirmer').trim()}function timeOf(e){return e.time||'Horaire à confirmer'}function priceOf(e){const p=e.category==='Junior'?e.juniorPrice:e.adultPrice;return p==null?'Prix à confirmer':(typeof p==='number'?'CHF '+p:String(p))}function deadlineOf(e){if(!e.registrationDeadline)return 'Date limite non communiquée';const d=date(e.registrationDeadline);return d.toLocaleDateString('fr-CH')+(e.registrationDeadlineTime?' à '+e.registrationDeadlineTime:'')}function chessmatesDeepLink(e){
  const base=e.firstSourceUrl||e.discoveryUrl||e.source||'';
  if(!/^https:\/\/chessmates\.live\//i.test(base))return base;
  // Text fragments scroll to the tournament name when it appears on the page.
  // Avoid passing an existing hash or query through to the fragment.
  const label=(e.title||'').trim();
  return base.split('#')[0]+(label?'#:~:text='+encodeURIComponent(label):'');
}
function verificationOf(e){return e.verificationStatus==='double_checked'?'Double vérification effectuée':e.verificationStatus==='conflict'?'Sources contradictoires — vérification nécessaire':'Double vérification non effectuée';}
function bestLink(e){
 const url=e.url||e.organizerUrl||e.firstSourceUrl||e.discoveryUrl||e.source||'';
 return /^https?:\/\//i.test(url)?(url===(e.firstSourceUrl||e.discoveryUrl||e.source)?chessmatesDeepLink(e):url):'';
}
function calendarClock(raw){
 const m=String(raw||'').match(/(\d{1,2})\s*(?:h|:)\s*(\d{2})?/i);
 if(!m)return null;
 const h=Number(m[1]),min=Number(m[2]||0);
 return h<=23&&min<=59?{h,min}:null;
}
function calendarTimes(e){
 const t=String(e.time||'');
 if(!t)return null;
 // Only infer times from a single-day event. Multi-day schedules stay all-day.
 if(e.endDate&&e.endDate!==e.date)return null;
 const normalized=t.replace(/\s+/g,' ').trim();
 const all=[...normalized.matchAll(/(\d{1,2})\s*(?:h|:)\s*(\d{2})?/gi)].map(m=>({h:Number(m[1]),min:Number(m[2]||0),index:m.index}));
 if(!all.length)return null;
 // Prefer explicitly marked starts over check-in, registration or lunch breaks.
 const startMatch=/(?:début(?: des parties)?|premi[eè]re ronde|start(?: zur? 1\. runde)?|beginn|ouverture et début)[^;,.]*?(\d{1,2}\s*(?:h|:)\s*\d{0,2})/i.exec(normalized);
 const afterStart=/(\d{1,2}\s*(?:h|:)\s*\d{0,2})[^;,.]{0,40}(?:premi[eè]re ronde|start zur? 1\. runde|début des parties)/i.exec(normalized);
 const begins=/(?:^|[;,.]\s*)(\d{1,2}\s*(?:h|:)\s*\d{0,2})\s*(?:début|premi[eè]re ronde|start)/i.exec(normalized);
 const explicit=startMatch?.[1]||afterStart?.[1]||begins?.[1];
 const checkin=/contr[oô]le|anwesenheit|accueil|inscription|check.in/i.test(normalized);
 const start=explicit?calendarClock(explicit):(!checkin?all[0]:null);
 if(!start)return null;
 const endMatch=/(?:fin(?: du tournoi)?|remise des prix|rangverk[uü]ndigung|siegerehrung)[^;,.]*?(\d{1,2}\s*(?:h|:)\s*\d{0,2})/i.exec(normalized);
 const endBefore=/(\d{1,2}\s*(?:h|:)\s*\d{0,2})[^;,.]{0,35}(?:fin|remise des prix|rangverk[uü]ndigung|siegerehrung)/i.exec(normalized);
 const range=/(\d{1,2}\s*(?:h|:)\s*\d{0,2})\s*[-–]\s*(\d{1,2}\s*(?:h|:)\s*\d{0,2})/.exec(normalized);
 let end=calendarClock(endMatch?.[1]||endBefore?.[1]||(!checkin&&range?range[2]:null));
 const startMinutes=start.h*60+start.min;
 if(end&&(end.h*60+end.min)<=startMinutes)end=null;
 if(!end)end={h:Math.floor((startMinutes+120)/60)%24,min:(startMinutes+120)%60};
 return {start,end};
}
function calendarLink(e){
 const startDay=(e.date||'').replace(/-/g,'');
 const endDate=e.endDate||e.date;
 const next=new Date(endDate+'T12:00:00');
 next.setDate(next.getDate()+1);
 const endDay=next.getFullYear()+String(next.getMonth()+1).padStart(2,'0')+String(next.getDate()).padStart(2,'0');
 const times=calendarTimes(e);
 const stamp=t=>startDay+'T'+String(t.h).padStart(2,'0')+String(t.min).padStart(2,'0')+'00';
 const dates=times?stamp(times.start)+'/'+stamp(times.end):startDay+'/'+endDay;
 const details=[e.title,e.venue||'',e.address||'',e.time||'',bestLink(e)].filter(Boolean).join('\n');
 const params=new URLSearchParams({action:'TEMPLATE',text:e.title,dates,details,location:[e.venue,e.address||e.city].filter(Boolean).join(', ')});
 if(times)params.set('ctz','Europe/Zurich');
 return 'https://calendar.google.com/calendar/render?'+params.toString();
}
function detail(e){
 const place=[e.venue||e.city,e.address||e.addressProvisional].filter(Boolean);
 const link=bestLink(e),verified=e.verificationStatus==='double_checked';
 const rows=[
  '<h2>'+safe(e.title)+'</h2>',
  '<p>📍 <strong>'+safe(place[0]||'Lieu à confirmer')+'</strong>'+(place[1]?'<br><span class="muted">'+safe(place[1])+'</span>':'')+'</p>',
  '<p>📅 '+date(e.date).toLocaleDateString('fr-CH')+(e.endDate&&e.endDate!==e.date?' – '+date(e.endDate).toLocaleDateString('fr-CH'):'')+'</p>',
  '<p>🕒 '+safe(timeOf(e))+'</p>',
  '<p>💰 '+safe(priceOf(e))+'</p>'
 ];
 rows.push('<p><a class="primary-link" target="_blank" rel="noopener" href="'+safe(calendarLink(e))+'">📅 Ajouter à mon calendrier ↗</a></p>');
 if(e.registrationDeadline)rows.push('<p>⏳ Inscription jusqu’au '+safe(deadlineOf(e))+'</p>');
 if(e.eligibility)rows.push('<p>'+safe(e.eligibility)+'</p>');
 if(link)rows.push('<p><a class="primary-link" target="_blank" rel="noopener" href="'+safe(link)+'">'+(e.url?'Voir l’annonce de l’organisateur':e.organizerUrl?'Voir le site de l’organisateur':'Voir la source du tournoi')+' ↗</a></p>');
 if(e.registrationUrl&&e.registrationUrl!==link&&/^https?:\/\//i.test(e.registrationUrl))rows.push('<p><a target="_blank" rel="noopener" href="'+safe(e.registrationUrl)+'">S’inscrire ↗</a></p>');
 if(e.address)rows.push('<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.address+', Suisse')+'">📍 Itinéraire Google Maps</a></p>');
 rows.push('<p class="verification muted">'+(verified?'✓ Informations recoupées avec deux sources':e.verificationStatus==='conflict'?'⚠ Informations contradictoires':'ⓘ Informations non encore recoupées avec deux sources')+'</p>');
 return '<article class="card detail-card">'+rows.join('')+'</article>';
}
function showDetail(e){$('calendar').className='hidden';$('list').className='hidden';$('selected-day').innerHTML='<button id="back-calendar" type="button">← Retour au calendrier</button>'+detail(e);$('back-calendar').onclick=()=>render();window.scrollTo(0,0)}function card(e){return '<article class="card event-card" role="button" tabindex="0" data-event="'+safe(e.id)+'"><strong>'+safe(locationOf(e))+'</strong><p>'+date(e.date).toLocaleDateString('fr-CH')+' · '+safe(timeOf(e))+'</p><p>'+safe(priceOf(e))+'</p><small>Voir les détails →</small></article>'}
function filtered(){return state.events.filter(e=>state.category==='all'||e.category===state.category)}
function render(){const m=state.month;$('selected-day').innerHTML='';$('month').textContent=fmt(m);$('calendar').className=state.view==='calendar'?'':'hidden';$('list').className=state.view==='list'?'':'hidden';const events=filtered();$('list').innerHTML=events.length?events.map(card).join(''):'<p>Aucun tournoi disponible pour ce filtre.</p>';let html='<div class="calendar">';for(const n of ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'])html+='<div class="muted">'+n+'</div>';const offset=(m.getDay()+6)%7;for(let i=0;i<offset;i++)html+='<div></div>';const count=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();for(let day=1;day<=count;day++){const key=m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');const matches=events.filter(e=>e.date<=key&&(e.endDate||e.date)>=key);html+='<div class="day'+(matches.length?' has-events':'')+'"'+(matches.length?' tabindex="0" role="button" data-day="'+key+'" aria-label="'+day+' : '+matches.length+' tournoi(s)"':'')+'><b>'+day+'</b>'+matches.map(e=>'<div class="event '+(e.category==='Junior'?'event-junior':'event-adult')+'" data-event="'+safe(e.id)+'" role="button" tabindex="0" title="'+safe(e.title)+'"><strong>'+safe(locationOf(e))+'</strong></div>').join('')+'</div>'}html+='</div>';$('calendar').innerHTML=html;document.querySelectorAll('[data-day]').forEach(el=>{const show=()=>{const key=el.dataset.day;const matches=events.filter(e=>e.date<=key&&(e.endDate||e.date)>=key);$('selected-day').innerHTML='<h3>Tournois du '+date(key).toLocaleDateString('fr-CH')+'</h3>'+matches.map(card).join('');bindEventCards();$('selected-day').scrollIntoView({behavior:'smooth',block:'nearest'})};el.addEventListener('click',ev=>{if(ev.target.closest('[data-event]'))return;show()});el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();show()}})});bindEventCards()}
function bindEventCards(){document.querySelectorAll('[data-event]').forEach(el=>{const show=()=>{const e=state.events.find(item=>item.id===el.dataset.event);if(e)showDetail(e)};el.onclick=show;el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();show()}}})}
// Navigation tactile horizontale dans la vue calendrier uniquement.
let swipeStart=null;
const calendarEl=$('calendar');
calendarEl.addEventListener('touchstart',ev=>{
  if(state.view!=='calendar'||ev.touches.length!==1){swipeStart=null;return}
  const t=ev.touches[0];swipeStart={x:t.clientX,y:t.clientY,time:Date.now()};
},{passive:true});
calendarEl.addEventListener('touchend',ev=>{
  if(!swipeStart||state.view!=='calendar'||ev.changedTouches.length!==1)return;
  const t=ev.changedTouches[0],dx=t.clientX-swipeStart.x,dy=t.clientY-swipeStart.y;
  swipeStart=null;
  if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.4)return;
  state.month=new Date(state.month.getFullYear(),state.month.getMonth()+(dx<0?1:-1),1);
  render();
},{passive:true});
calendarEl.addEventListener('touchcancel',()=>{swipeStart=null},{passive:true});
$('prev').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);render()};$('next').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);render()};$('today').onclick=()=>{state.month=new Date(today.getFullYear(),today.getMonth(),1);render()};$('view').onchange=e=>{state.view=e.target.value;render()};document.querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{state.category=button.dataset.category;document.querySelectorAll('[data-category]').forEach(b=>{const active=b===button;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});render()});
async function refreshEvents(){
 const btn=$('refresh'),bar=$('refresh-progress'),fill=$('refresh-fill');
 btn.disabled=true;bar.classList.remove('hidden');fill.style.width='15%';
 $('status').textContent='Actualisation des données…';
 try{
  const response=await fetch('./tournois.json?time='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  fill.style.width='65%';
  const data=await response.json();
  if(!Array.isArray(data))throw Error('Format de données invalide');
  state.events=data.filter(e=>(e.endDate||e.date)>=today.toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date));
  fill.style.width='100%';
  $('status').textContent=state.events.length+' tournois · '+state.events.filter(e=>e.dataQuality==='official_page').length+' annonces officielles';
  render();
 }catch(err){$('status').textContent='Échec de l’actualisation : '+err.message;render()}
 finally{btn.disabled=false;bar.classList.add('hidden');fill.style.width='0%'}
}
$('refresh').onclick=refreshEvents;
refreshEvents();
</script></body></html>
