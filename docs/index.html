<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243b53"><title>ChessTour CH</title>
<style>body{font:16px system-ui;background:#f5f7fa;color:#243b53;margin:0}header{background:#243b53;color:white;padding:20px}main{max-width:960px;margin:auto;padding:16px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button,select,input{font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:white}.calendar{width:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-width:0;overflow:hidden;background:white;min-height:70px;border-radius:8px;padding:5px;font-size:12px}.day b{display:block}.event{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#dbeafe;border-radius:5px;padding:4px;margin:3px 0;overflow-wrap:anywhere}.card{overflow-wrap:anywhere;background:white;border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001}.muted{color:#64748b}a{color:#1457a5}.hidden{display:none}@media(max-width:600px){main{padding:10px}.controls{gap:6px}.controls button,.controls select{font-size:14px;padding:7px}.calendar{gap:3px}.day{min-height:47px;font-size:11px;padding:3px}.day .event{font-size:10px;white-space:normal;line-height:1.2;max-height:2.4em;overflow:hidden}.day .event:not(:first-of-type){display:none}.day .event{background:#dbeafe}.card{padding:12px}}.day.has-events{cursor:pointer;outline:1px solid #b3d0ef}.day:focus{outline:2px solid #1457a5}#selected-day{margin-top:14px}#selected-day:empty{display:none}</style></head><body>
<header><h1>♟ ChessTour CH</h1><div>Tournois d'échecs en Suisse · Grenchen (SO)</div></header>
<main><p id="status" class="muted">Chargement des tournois…</p>
<div class="controls"><button id="prev">◀</button><strong id="month"></strong><button id="next">▶</button><button id="today">Ce mois</button><select id="view"><option value="calendar">Calendrier</option><option value="list">Liste</option></select><select id="category"><option value="all">Toutes catégories</option><option value="Junior">Juniors</option><option value="Adultes">Adultes</option></select></div>
<div id="calendar"></div><div id="selected-day" aria-live="polite"></div><div id="list"></div></main>
<script>
const today=new Date(),state={month:new Date(today.getFullYear(),today.getMonth(),1),events:[],view:'calendar',category:'all'};
const $=id=>document.getElementById(id), fmt=d=>new Intl.DateTimeFormat('fr-CH',{month:'long',year:'numeric'}).format(d);
function date(s){return new Date(s+'T12:00:00')}
function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(e){return '<article class="card"><strong>'+safe(e.title)+'</strong><p>'+date(e.date).toLocaleDateString('fr-CH')+(e.city?' · '+safe(e.city):'')+' · '+safe(e.category)+'</p><p class="muted">Prix et inscription : à confirmer</p><a href="'+encodeURI(e.url||e.source)+'" target="_blank" rel="noopener">Source officielle</a>'+(e.city?' · <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.city+', Suisse')+'">Google Maps (ville)</a>':'')+'</article>'}
function filtered(){return state.events.filter(e=>state.category==='all'||e.category===state.category)}
function render(){const m=state.month;$('selected-day').innerHTML='';$('month').textContent=fmt(m);$('calendar').className=state.view==='calendar'?'':'hidden';$('list').className=state.view==='list'?'':'hidden';const events=filtered();$('list').innerHTML=events.length?events.map(card).join(''):'<p>Aucun tournoi disponible pour ce filtre.</p>';let html='<div class="calendar">';for(const n of ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'])html+='<div class="muted">'+n+'</div>';const offset=(m.getDay()+6)%7;for(let i=0;i<offset;i++)html+='<div></div>';const count=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();for(let day=1;day<=count;day++){const key=m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');const matches=events.filter(e=>e.date<=key&&(e.endDate||e.date)>=key);html+='<div class="day'+(matches.length?' has-events':'')+'"'+(matches.length?' tabindex="0" role="button" data-day="'+key+'" aria-label="'+day+' : '+matches.length+' tournoi(s)"':'')+'><b>'+day+'</b>'+matches.map(e=>'<div class="event" title="'+safe(e.title)+'">'+safe(e.title)+'</div>').join('')+'</div>'}html+='</div>';$('calendar').innerHTML=html;document.querySelectorAll('[data-day]').forEach(el=>{const show=()=>{const key=el.dataset.day;const matches=events.filter(e=>e.date<=key&&(e.endDate||e.date)>=key);$('selected-day').innerHTML='<h3>Tournois du '+date(key).toLocaleDateString('fr-CH')+'</h3>'+matches.map(card).join('');$('selected-day').scrollIntoView({behavior:'smooth',block:'nearest'})};el.addEventListener('click',show);el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();show()}})})}
$('prev').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);render()};$('next').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);render()};$('today').onclick=()=>{state.month=new Date(today.getFullYear(),today.getMonth(),1);render()};$('view').onchange=e=>{state.view=e.target.value;render()};$('category').onchange=e=>{state.category=e.target.value;render()};
fetch('./tournois.json?time='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{state.events=Array.isArray(data)?data.filter(e=>e.date>=today.toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)):[];$('status').textContent=state.events.length+' tournois disponibles · Source : Fédération suisse des échecs (juniors)';render()}).catch(e=>{$('status').textContent='Impossible de charger les données : '+e.message;render()});
</script></body></html>
