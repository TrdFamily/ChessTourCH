name: Construire APK Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Vérifier Android SDK préinstallé
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Générer icône Android depuis le logo
        run: |
          python -m pip install cairosvg
          mkdir -p app/src/main/res/drawable-nodpi
          python -c "import cairosvg; cairosvg.svg2png(url='app/src/main/assets/chesstour-icon.svg',write_to='app/src/main/res/drawable-nodpi/chesstour_icon.png',output_width=512,output_height=512)"
      - name: Construire APK
        run: gradle :app:assembleDebug --no-daemon
      - name: APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: ChessTourCH-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
