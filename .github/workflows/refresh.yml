name: Actualiser les tournois
on:
  workflow_dispatch:
  schedule:
    - cron: '25 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les annonces juniors
        run: python collector/update.py
      - name: Publier le calendrier
        run: |
          git config user.name "ChessTour bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/tournois.json
          git diff --cached --quiet || (git commit -m "Actualiser calendrier" && git push)
