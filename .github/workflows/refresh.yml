name: Actualiser les tournois
on:
  workflow_dispatch:
  push:
    paths:
      - 'collector/update.py'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '25 */6 * * *'
concurrency:
  group: chesstour-calendar-refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le lecteur PDF
        run: python -m pip install pypdf==6.1.3
      - name: Collecter les annonces et rechercher les pages organisateurs
        run: python collector/update.py
      - name: Publier le calendrier
        run: |
          git config user.name "ChessTour bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/tournois.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser calendrier"
            for attempt in 1 2 3; do
              (git pull --rebase origin main && git push origin HEAD:main) && exit 0
              git rebase --abort || true
              sleep 3
            done
            echo "Impossible de publier après trois tentatives" >&2
            exit 1
          fi
